<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EroMusicSearch — Anime &amp; Game Music Search</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TsukobuP" />
    <meta name="twitter:title" content="EroMusicSearch — Anime &amp; Game Music Search" />
    <meta
      name="twitter:description"
      content="ゲーム・アニメの楽曲を3つのデータベースから双方向検索。ErogameScape / Bangumi / Anison.info対応。"
    />
    <meta name="twitter:image" content="https://tsukubakobu.github.io/EroMusicSearch/og-image.png" />

    <!-- Open Graph (fallback for other platforms) -->
    <meta property="og:title" content="EroMusicSearch — Anime &amp; Game Music Search" />
    <meta
      property="og:description"
      content="ゲーム・アニメの楽曲を3つのデータベースから双方向検索。ErogameScape / Bangumi / Anison.info対応。"
    />
    <meta property="og:image" content="https://tsukubakobu.github.io/EroMusicSearch/og-image.png" />
    <meta property="og:url" content="https://tsukubakobu.github.io/EroMusicSearch/" />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div class="titlebar"></div>

    <div class="container">
      <div class="search-bar">
        <select id="modeSelect">
          <option value="erogamescape|gameToMusic">EGS：作品→音楽</option>
          <option value="erogamescape|musicToGame">EGS：音楽→作品</option>
          <option value="bangumi|gameToMusic">Bangumi：作品→音楽</option>
          <option value="bangumi|musicToGame">Bangumi：音楽→作品</option>
          <option value="anison|gameToMusic">Anison.info：作品→音楽</option>
          <option value="anison|musicToGame">Anison.info：音楽→作品</option>
        </select>
        <input type="text" id="searchInput" placeholder="日本語で入力..." autofocus />
        <button id="searchBtn">↵</button>
        <label class="mirror-label" title="使用大陸可用的EGS鏡像站 koko.kyara.top">
          <input type="checkbox" id="mirrorCheck" /> CN鏡像
        </label>
      <div class="settings-wrapper">
        <button id="settingsBtn" class="settings-btn" title="設定">⚙</button>
        <div id="settingsMenu" class="settings-menu hidden">
          <div class="menu-section">
            <div class="menu-label">検索</div>
            <div class="menu-row">
              <span>既定のデータソース</span>
              <select id="settingsSource">
                <option value="erogamescape">EGS</option>
                <option value="bangumi">Bangumi</option>
                <option value="anison">Anison.info</option>
              </select>
            </div>
            <div class="menu-row">
              <span>既定の検索方向</span>
              <select id="settingsMode">
                <option value="gameToMusic">作品→音楽</option>
                <option value="musicToGame">音楽→作品</option>
              </select>
            </div>
            <div class="menu-row">
              <label class="menu-check">
                <input type="checkbox" id="settingsMirror" />
                CNミラーを既定でON
              </label>
            </div>
          </div>
          <div class="menu-section">
            <div class="menu-label">外観</div>
            <div class="menu-row">
              <span>フォントサイズ</span>
              <select id="settingsFontSize">
                <option value="S">S</option>
                <option value="M">M</option>
                <option value="L">L</option>
              </select>
            </div>
            <div class="menu-row">
              <span>ウィンドウサイズ</span>
              <select id="settingsWindowSize">
                <option value="800x600">800×600</option>
                <option value="900x700">900×700</option>
                <option value="1024x768">1024×768</option>
              </select>
            </div>
          </div>
          <div class="menu-section">
            <button id="clearCacheBtn" class="menu-btn">🗑 キャッシュを削除</button>
          </div>
        </div>
      </div>
      </div>

      <div id="loader" class="hidden">検索中...</div>
      <div id="errorBox" class="hidden"></div>
      <div id="noResults" class="hidden">見つかりませんでした。</div>
      <div id="cacheIndicator" class="hidden cache-indicator"></div>

      <div class="results-wrapper">
        <table id="resultsTable" class="hidden">
          <thead>
            <tr id="tableHeaderRow"></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
